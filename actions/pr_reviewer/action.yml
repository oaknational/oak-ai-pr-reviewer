name: "AI PR Reviewer"
description: "Run an AI-based inline review on a pull request and post comments at specific lines."
inputs:
  openai_api_key:
    description: 'OpenAI API key.'
    required: true
  github_token:
    description: 'GitHub token.'
    default: ${{ github.token }}
  comment_id:
    description: 'Comment ID to react to'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: React to comment
      if: inputs.comment_id != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          await github.rest.reactions.createForIssueComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            comment_id: ${{ inputs.comment_id }},
            content: 'eyes'
          });

    - name: Get PR number from comment
      id: get-pr
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const prNumber = context.issue.number;
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber
          });
          core.setOutput('pr-number', prNumber);
          core.setOutput('base-ref', pr.base.ref);
          core.setOutput('head-ref', pr.head.ref);
          return prNumber;

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.get-pr.outputs.head-ref }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies and build
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci && npm run build

    - name: Run AI inline review
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ steps.get-pr.outputs.pr-number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        node ${{ github.action_path }}/dist/index.js

    - name: React to comment with success
      if: inputs.comment_id != '' && success()
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          await github.rest.reactions.createForIssueComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            comment_id: ${{ inputs.comment_id }},
            content: '+1'
          });